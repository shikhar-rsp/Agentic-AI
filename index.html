<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bajaj eKYC — Get Started</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/atlas/atlas.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="ekyc-shell">
      <header class="ekyc-header">
        <i data-lucide="shield-check" style="width: 40px; height: 40px; color: var(--color-blue-600)"></i>
        <h1 class="ekyc-title">Verify your identity</h1>
        <p class="ekyc-subtitle">
          Complete your eKYC in a few quick steps. Keep your PAN and Aadhaar handy.
        </p>
      </header>

      <!-- Placeholder content — real screens get built from the Figma designs. -->
      <div class="ekyc-actions">
        <button class="btn btn-secondary" type="button">Back</button>
        <button class="btn btn-primary" type="button">Get started</button>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/atlas/atlas.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
