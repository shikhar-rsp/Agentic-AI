<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bajaj eKYC — Send KYC Link</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/atlas/atlas.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/kyc-send-link.css" />
  </head>
  <body>
    <div class="sendlink-page">
      <div class="sendlink-bg" aria-hidden="true"></div>

      <!-- ============ Header ============ -->
      <header class="kyc-header">
        <div class="kyc-header__row">
          <img class="kyc-logo" src="../assets/img/bajaj-logo.png" alt="Bajaj General Insurance" />
          <div class="kyc-avatar">
            <img src="../assets/img/agent-avatar.jpg" alt="Support agent" />
            <span class="kyc-avatar__dot" aria-hidden="true"></span>
          </div>
        </div>
        <span class="badge badge-sm badge-light badge-red">
          <i data-lucide="alert-circle" style="width: 16px; height: 16px"></i>
          Link expires in 12hr 32mins
        </span>
      </header>

      <!-- ============ Body ============ -->
      <div class="sendlink-body">
        <div class="sendlink-card">
          <div class="sendlink-head">
            <h1 class="sendlink-title">Send KYC Link to Customer</h1>
            <p class="sendlink-subtitle">
              Share a secure link for the customer to complete KYC on their own device.
            </p>
          </div>

          <a class="sendlink-back" href="kyc-initiation.html">
            <i data-lucide="arrow-left"></i>
            Back
          </a>

          <!-- Customer info -->
          <div class="sendlink-customer">
            <div>
              <div class="sendlink-customer__label">Customer Name</div>
              <div class="sendlink-customer__value">Ashok Kumar</div>
            </div>
            <div class="sendlink-customer__meta-group">
              <p class="sendlink-customer__meta">Partner ID: <strong>C1738E474E73</strong></p>
              <p class="sendlink-customer__meta">Customer Type: <strong>Individual</strong></p>
            </div>
          </div>

          <!-- Required Details -->
          <section class="sendlink-section">
            <p class="sendlink-section__bar">Required Details</p>
            <div class="sendlink-fields">
              <div class="form-field">
                <label class="form-label" for="sl-mobile">
                  Mobile Number <span class="sendlink-req">*</span>
                </label>
                <div class="form-input-wrapper">
                  <input
                    class="form-input"
                    id="sl-mobile"
                    type="tel"
                    inputmode="numeric"
                    maxlength="10"
                    placeholder="Enter 10-digit mobile number"
                  />
                </div>
              </div>

              <div class="form-field">
                <label class="form-label" for="sl-email">Email ID</label>
                <div class="form-input-wrapper">
                  <input
                    class="form-input"
                    id="sl-email"
                    type="email"
                    placeholder="Enter a valid email ID"
                  />
                </div>
              </div>
            </div>
          </section>

          <!-- Additional Settings -->
          <section class="sendlink-section">
            <p class="sendlink-section__bar">Additional Settings</p>
            <div class="sendlink-fields">
              <div class="form-field">
                <label class="form-label" for="sl-language">Language</label>
                <div class="form-input-wrapper sendlink-select-wrap">
                  <select class="sendlink-select" id="sl-language">
                    <option>English</option>
                    <option>Hindi</option>
                    <option>Marathi</option>
                    <option>Tamil</option>
                    <option>Telugu</option>
                  </select>
                  <i data-lucide="chevron-down" class="sendlink-select-caret"></i>
                </div>
              </div>

              <div class="form-field">
                <label class="form-label" for="sl-expiry">Link expires in</label>
                <div class="form-input-wrapper sendlink-select-wrap">
                  <select class="sendlink-select" id="sl-expiry">
                    <option>48 hrs</option>
                    <option>24 hrs</option>
                    <option>72 hrs</option>
                    <option>7 days</option>
                  </select>
                  <i data-lucide="chevron-down" class="sendlink-select-caret"></i>
                </div>
              </div>
            </div>
          </section>

          <!-- Captcha -->
          <div class="sendlink-fields">
            <div class="form-field">
              <label class="form-label" for="sl-captcha">
                Enter Captcha <span class="sendlink-req">*</span>
              </label>
              <div class="form-input-wrapper">
                <input class="form-input" id="sl-captcha" type="text" placeholder="Enter answer" />
              </div>
            </div>
            <div class="sendlink-captcha">
              <div class="sendlink-captcha__img">
                <img src="../assets/img/captcha-sample.png" alt="Captcha" />
              </div>
              <button type="button" class="sendlink-captcha__refresh" id="sl-captcha-refresh" aria-label="Refresh captcha">
                <i data-lucide="refresh-cw"></i>
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button type="button" class="btn btn-primary sendlink-submit" id="sl-submit" disabled>
            Send Link to Customer
            <i data-lucide="send"></i>
          </button>
        </div>
      </div>
    </div>

    <script src="../assets/vendor/lucide.min.js"></script>
    <script src="../assets/atlas/atlas.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/kyc-send-link.js"></script>
  </body>
</html>
